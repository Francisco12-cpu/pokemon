    </div>
    <button class="btn btn-back" id="btn-back-online">VOLTAR</button>

      <div id="rival-mon" class="mon-container rival">

        <div class="info">

          <span class="name"></span>
          <div class="hp-bar"><div class="hp-fill"></div></div>
          <span class="hp-text"></span>
          <span class="status"></span>

    <h2 class="pixel-title">DERROTA...</h2>

  </section>
</div>

const GEN = Generations.get(9);
const SPRITE_BASE = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated';

function calcStats(base) {
  const nivel = 50;
  const hp = Math.floor((2 * base.hp + 31) * nivel / 100 + nivel + 10);
  const atk = Math.floor(((2 * base.atk + 31) * nivel / 100 + 5));
  const def = Math.floor(((2 * base.def + 31) * nivel / 100 + 5));
  const spa = Math.floor(((2 * base.spa + 31) * nivel / 100 + 5));
  const spd = Math.floor(((2 * base.spd + 31) * nivel / 100 + 5));
  const spe = Math.floor(((2 * base.spe + 31) * nivel / 100 + 5));
  return { maxHp: hp, currentHp: hp, attack: atk, defense: def, specialAttack: spa, specialDefense: spd, speed: spe };
}

// ============================================================================
// POKEAPI.JS
// ============================================================================
const CACHE_KEY = 'pokedex_cache';

function saveCache(c) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch(e) {} }

async function fetchPokemonRaw(query) {
  const url = `https://pokeapi.co/api/v2/pokemon/${query.toLowerCase().trim()}`;
  const r = await fetch(url);
  if (!r.ok) return null;
  return r.json();
}

async function fetchMovesForPokemon(pokemonRaw, typeFilter = null) {
  if (!pokemonRaw?.moves) return [];
  const urls = [...new Set(pokemonRaw.moves.map(m => m.move.url))];
  const chunks = []; for (let i=0; i<urls.length; i+=10) chunks.push(urls.slice(i, i+10));
  let moves = [];
  for (const chunk of chunks) {
    const res = await Promise.all(chunk.map(async u => {
      try { const d = await (await fetch(u)).json(); return normalizeMove(d); } catch(e) { return null; }
    }));
    moves.push(...res.filter(Boolean));
  }
  if (typeFilter) moves = moves.filter(m => m.type === typeFilter.toLowerCase());
  moves.sort((a,b) => a.name.localeCompare(b.name));
  return moves;
}

function normalizeMove(d) {
  return {
    name: d.name, type: d.type?.name || 'normal', power: d.power ?? 0, accuracy: d.accuracy ?? 100,
    category: d.damage_class?.name || 'physical',
    ailment: d.meta?.ailment?.name ?? null, ailmentChance: d.meta?.ailment_chance ?? null,
    statChanges: d.stat_changes?.map(c => ({ stat: c.stat.name, change: c.change })) ?? null
  };
}

function normalizeChosenPokemon(raw, moves) {
  const stats = {}; raw.stats.forEach(s => stats[s.stat.name] = s.base_stat);
  const hp = Math.floor((2*(stats.hp||0)+31) * 50/100 + 60);
  return {
    key: raw.id,
    name: raw.name.charAt(0).toUpperCase() + raw.name.slice(1),
    types: raw.types.map(t => TYPE_TRANSLATION[t.type.name] || t.type.name),
    sprite: raw.sprites?.front_default || `${SPRITE_BASE}/${raw.id}.gif`,
    maxHp: hp, currentHp: hp,
    attack: Math.floor(((2*(stats.attack||0)+31) * 50/100 + 5)),
    defense: Math.floor(((2*(stats.defense||0)+31) * 50/100 + 5)),
    specialAttack: Math.floor(((2*(stats['special-attack']||0)+31) * 50/100 + 5)),
    specialDefense: Math.floor(((2*(stats['special-defense']||0)+31) * 50/100 + 5)),
    speed: Math.floor(((2*(stats.speed||0)+31) * 50/100 + 5)),
    moves: moves.map(m => ({
      name: m.name, type: m.type, power: m.power, accuracy: m.accuracy, category: m.category,
      ailment: m.ailment, ailmentChance: m.ailmentChance, statChanges: m.statChanges
    })),
    status: null, boosts: { atk:0, def:0, spa:0, spd:0, spe:0 }
  };
}

function saveToLocalDex(p) { const c = loadCache(); c[p.key] = p; saveCache(c); }
function getFullRoster() {
  const c = loadCache(); const map = {};
  ROSTER_INICIAL.forEach(p => map[p.key] = p);
  Object.values(c).forEach(p => map[p.key] = p);
  return Object.values(map);
}

const IVS = { hp:31, atk:31, def:31, spa:31, spd:31, spe:31 };
const EVS = { hp:0, atk:0, def:0, spa:0, spd:0, spe:0 };

const battleState = {
  playerParty: [], rivalParty: [],
  playerActiveIndex: 0, rivalActiveIndex: 0,
  battleOver: false, winner: null
};

function currentPlayerMon() { return battleState.playerParty[battleState.playerActiveIndex]; }
function currentRivalMon() { return battleState.rivalParty[battleState.rivalActiveIndex]; }

function toCalcPokemon(mon) {
  return new Pokemon(GEN, mon.name, {
    level: 50, ivs: IVS, evs: EVS, nature: 'Serious',
    curHP: mon.currentHp, status: mon.status || '',
    boosts: {
      atk: mon.boosts?.atk ?? 0, def: mon.boosts?.def ?? 0,
      spa: mon.boosts?.spa ?? 0, spd: mon.boosts?.spd ?? 0, spe: mon.boosts?.spe ?? 0
    }
  });
}
function toCalcMove(move) { return new Move(GEN, move.name); }

const knownStatusMoves = {
  'thunder-wave': { ailment:'par', chance:90 }, 'will-o-wisp': { ailment:'brn', chance:85 },
  'toxic': { ailment:'psn', chance:90 }, 'spore': { ailment:'slp', chance:100 },
  'hypnosis': { ailment:'slp', chance:60 }, 'sing': { ailment:'slp', chance:55 },
  'ice-beam': { ailment:'frz', chance:10 }, 'blizzard': { ailment:'frz', chance:10 },
  'body-slam': { ailment:'par', chance:30 }, 'thunder': { ailment:'par', chance:30 },
  'flamethrower': { ailment:'brn', chance:10 }, 'scald': { ailment:'brn', chance:30 },
  'lava-plume': { ailment:'brn', chance:30 }, 'sludge-bomb': { ailment:'psn', chance:30 },
  'discharge': { ailment:'par', chance:30 }, 'ice-punch': { ailment:'frz', chance:10 }
};

function applyMoveSecondaryEffects(attacker, defender, move, log) {
  if (move.ailment && move.ailmentChance && Math.random()*100 < move.ailmentChance && !defender.status) {
    const map = { paralysis:'par', burn:'brn', poison:'psn', sleep:'slp', freeze:'frz' };
    defender.status = map[move.ailment] || '';
    log.push(`${defender.name} ficou ${defender.status}!`);
  }
  if (move.statChanges) {
    move.statChanges.forEach(ch => {
      if (!defender.boosts) defender.boosts = { atk:0, def:0, spa:0, spd:0, spe:0 };
      defender.boosts[ch.stat] = Math.min(6, Math.max(-6, (defender.boosts[ch.stat]||0) + ch.change));
    });
  }
  const fb = knownStatusMoves[move.name];
  if (fb && !defender.status && Math.random()*100 < fb.chance) {
    defender.status = fb.ailment;
    log.push(`${defender.name} ficou ${fb.ailment}!`);
  }
}

function processSwitch(side, index) {
  const party = side === 'player' ? battleState.playerParty : battleState.rivalParty;
  const field = side === 'player' ? 'playerActiveIndex' : 'rivalActiveIndex';
  const old = party[battleState[field]];
  if (!party[index] || party[index].currentHp <= 0) return { log: ['Troca inválida!'], ok: false };
  battleState[field] = index;
  return { log: [`${old.name}, volte!`, `Vai, ${party[index].name}!`], ok: true };
}

let faintResolve = null;
async function handleFaint(side) {
  const party = side === 'player' ? battleState.playerParty : battleState.rivalParty;
  const activeIdx = side === 'player' ? battleState.playerActiveIndex : battleState.rivalActiveIndex;
  const fainted = party[activeIdx];
  const aliveIdx = party.findIndex((m,i) => m.currentHp > 0 && i !== activeIdx);
  if (aliveIdx === -1) {
    battleState.battleOver = true;
    battleState.winner = side === 'player' ? 'rival' : 'player';
    return { log: [`${fainted.name} desmaiou! ${battleState.winner==='player'?'Você':'O rival'} venceu!`] };
  }
  if (side === 'player') {
    return new Promise(resolve => {
      faintResolve = (idx) => {
        if (party[idx]?.currentHp > 0) {
          battleState.playerActiveIndex = idx;
          resolve({ log: [`${fainted.name} desmaiou!`, `Vai, ${party[idx].name}!`] });
        } else faintResolve = resolve;
      };
    });
  } else {
    battleState.rivalActiveIndex = aliveIdx;
    return { log: [`${fainted.name} desmaiou!`, `O rival enviou ${party[aliveIdx].name}!`] };
  }
}
function setPlayerFaintChoice(idx) { if (faintResolve) { faintResolve(idx); faintResolve = null; } }

async function resolveTurn(playerAction, rivalAction) {
  if (battleState.battleOver) return { log:['Batalha encerrada.'], battleOver:true, winner:battleState.winner };
  const log = [];
  if (playerAction.type === 'switch') log.push(...processSwitch('player', playerAction.index).log);
  if (rivalAction.type === 'switch') log.push(...processSwitch('rival', rivalAction.index).log);
  const pMove = playerAction.type==='move' ? playerAction.move : null;
  const rMove = rivalAction.type==='move' ? rivalAction.move : null;
  const willP = pMove && playerAction.type!=='switch';
  const willR = rMove && rivalAction.type!=='switch';

  const attackers = [];
  if (willP) attackers.push({ side:'player', attacker:currentPlayerMon(), defender:currentRivalMon(), move:pMove });
  if (willR) attackers.push({ side:'rival', attacker:currentRivalMon(), defender:currentPlayerMon(), move:rMove });
  attackers.sort((a,b) => {
    const ma = toCalcMove(a.move), mb = toCalcMove(b.move);
    if (ma.priority !== mb.priority) return mb.priority - ma.priority;
    const pa = toCalcPokemon(a.attacker), pb = toCalcPokemon(b.attacker);
    let sa = pa.stats.spe, sb = pb.stats.spe;
    if (pa.status === 'par') sa = Math.floor(sa * 0.25);
    if (pb.status === 'par') sb = Math.floor(sb * 0.25);
    if (sa !== sb) return sb - sa;
    return Math.random() < 0.5 ? -1 : 1;
  });

  for (const a of attackers) {
    if (a.defender.currentHp <= 0) continue;
    const atker = toCalcPokemon(a.attacker);
    const defer = toCalcPokemon(a.defender);
    const move = toCalcMove(a.move);
    if (move.accuracy !== true && Math.random()*100 > (move.accuracy||100)) {
      log.push(`${a.attacker.name} usou ${a.move.name}, mas errou!`);
      continue;
    }
    const result = calculate(GEN, atker, defer, move);
    const dmg = result.damage[Math.floor(Math.random()*result.damage.length)];
    const faint = a.defender.currentHp - dmg <= 0;
    a.defender.currentHp = Math.max(0, a.defender.currentHp - dmg);
    log.push(`${a.attacker.name} usou ${a.move.name}! ${result.critical?'Crítico! ':''}Causou ${dmg} de dano.`);
    applyMoveSecondaryEffects(a.attacker, a.defender, a.move, log);
    if (faint) {
      log.push(`${a.defender.name} desmaiou!`);
      const fr = await handleFaint(a.defender === currentPlayerMon() ? 'player' : 'rival');
      log.push(...fr.log);
      if (battleState.battleOver) return { log, battleOver:true, winner:battleState.winner };
    }
  }
  [currentPlayerMon(), currentRivalMon()].forEach((m,i) => {
    if (m && m.currentHp <= 0) handleFaint(i===0?'player':'rival').then(fr => log.push(...fr.log));
  });
  return { log, battleOver:battleState.battleOver, winner:battleState.winner };
}

  else if (uiState.mode==='duo') { if (uiState.currentPlayer===1) { uiState.playerAction=action; playPassTurn(2); return; } else { pAct=uiState.playerAction; rAct=action; uiState.playerAction=null; } }
  await executeTurn(pAct, rAct);
}
async function executeTurn(pAct, rAct) {
  disableControls(); const result = await resolveTurn(pAct, rAct);
  document.getElementById('battle-log').innerHTML = result.log.map(m => `<p>${m}</p>`).join('');
  renderBattleField();
  if (result.battleOver) { showScreen(result.winner==='player'?'victory':'defeat'); return; }
  if (currentPlayerMon()?.currentHp <= 0) { showSwitchForFaint(); }
  else if (uiState.mode==='duo') { uiState.currentPlayer=1; playPassTurn(1); }
  else { setupTurn(); }
}
function showSwitchForFaint() {
  const menu = document.getElementById('switch-menu'); menu.innerHTML = '';
  battleState.playerParty.forEach((m,i) => { if (i===battleState.playerActiveIndex || m.currentHp<=0) return; const b = document.createElement('button'); b.className = 'switch-option'; b.innerHTML = `${m.name} (${m.currentHp}/${m.maxHp})`; b.addEventListener('click', () => { menu.classList.add('hidden'); setPlayerFaintChoice(i); renderBattleField(); setupTurn(); }); menu.appendChild(b); });
  menu.classList.remove('hidden');
}
function playPassTurn(next) {
  const overlay = document.getElementById('pass-turn-overlay'); overlay.classList.remove('hidden');
  overlay.querySelector('.message').textContent = `Passe o celular para o Jogador ${next}`;
  overlay.querySelector('.ready-btn').onclick = () => { overlay.classList.add('hidden'); uiState.currentPlayer = next; if (next===2) { enableControls(2); } else { enableControls(1); uiState.playerAction = null; } };
  disableControls();
}
onReceiveAction((action) => { if (uiState.mode!=='online'||battleState.battleOver) return; if (uiState.playerAction) { const p=uiState.playerAction; uiState.playerAction=null; executeTurn(p,action); } else { uiState.opponentAction=action; enableControls(1); } });
['btn-play-again','btn-play-again-defeat'].forEach(id => { document.getElementById(id)?.addEventListener('click', () => { battleState.playerParty=[]; battleState.rivalParty=[]; battleState.battleOver=false; battleState.winner=null; showScreen('mode'); }); });

// ============================================================================
// INÍCIO
// ============================================================================
showScreen('intro');
console.log('Desafio de Aniversário — Criado por Francisco Audir (@filho.af)');
</script>
